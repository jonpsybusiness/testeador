<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión Jonpsykez (16:9)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0e0e10;
            color: #efeff1;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        /* Contenedor de la Webcam */
        .video-container {
            flex: 3; /* Ocupa el 75% de la pantalla */
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene el ratio 16:9 real sin deformar ni recortar */
        }
        /* Contenedor del Chat de Twitch */
        .chat-container {
            flex: 1; /* Ocupa el 25% restante */
            border-left: 1px solid #2f2f35;
            background-color: #18181c;
            height: 100%;
            min-width: 320px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Lado Izquierdo: Cámara web en formato panorámico 16:9 -->
    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <!-- Lado Derecho: El Chat se genera de forma segura mediante JavaScript -->
    <div class="chat-container" id="chat-box"></div>

    <script>
        /**************************************************************
         * 1. CONFIGURACIÓN DEL CHAT DE TWITCH (REPARADO)
         **************************************************************/
        // Detecta automáticamente el dominio actual (ej: "tuusuario.github.io" o "localhost")
        const currentDomain = window.location.hostname;
        const chatBox = document.getElementById('chat-box');
        
        // Creamos el iframe con los permisos de seguridad exigidos por Twitch
        const iframe = document.createElement('iframe');
        iframe.src = `https://twitch.tv{currentDomain}&darkpopout`;
        iframe.id = "twitch-chat";
        
        // Insertamos el chat reparado en la página
        chatBox.appendChild(iframe);


        /**************************************************************
         * 2. CONFIGURACIÓN DE LA WEBCAM (FORZADO EN 16:9 / HD)
         **************************************************************/
        const video = document.getElementById('webcam');

        const opcionesCamara = {
            video: {
                width: { ideal: 1920, min: 1280 },  // Intenta 1080p, si no, baja a 720p
                height: { ideal: 1080, min: 720 },
                aspectRatio: { ideal: 1.7777777778 } // Forzar relación de aspecto 16:9
            },
            audio: false
        };

        // Solicita accesos a la cámara e inicia el reproductor
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia(opcionesCamara)
                .then(function(stream) {
                    video.srcObject = stream;
                })
                .catch(function(error) {
                    console.error("Error al configurar la webcam: ", error);
                    alert("Asegúrate de conceder los permisos de la cámara en tu navegador.");
                });
        } else {
            alert("Tu navegador actual no soporta el acceso a la cámara.");
        }
    </script>
</body>
</html>
