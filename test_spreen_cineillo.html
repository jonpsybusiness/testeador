<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spreen × cineillojuan – En Directo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0e0e10;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    .stream-page-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      background: #0e0e10;
    }
    .stream-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #18181b;
      padding: 10px 16px;
      border-bottom: 1px solid #2a2a2e;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 12px;
    }
    .stream-topbar-left { display: flex; align-items: center; gap: 10px; flex-grow: 1; }
    .live-badge {
      background: #e60054; color: #ffffff; font-size: 11px;
      font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.5px;
    }
    
    .url-changer-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1f1f23;
      border: 1px solid #2a2a2e;
      border-radius: 6px;
      padding: 3px 6px;
      max-width: 450px;
      width: 100%;
    }
    .url-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #efeff1;
      font-size: 12px;
      padding: 4px;
      outline: none;
    }
    .url-input::placeholder { color: #5a5a66; }
    .url-btn {
      background: #e60054;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .url-btn:hover { background: #ff1a6c; }

    .stream-topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .platform-tag {
      display: inline-flex; align-items: center; gap: 5px;
      background: #1f1f23; border: 1px solid #2a2a2e;
      border-radius: 4px; padding: 4px 8px; font-size: 11px; font-weight: 600;
    }
    .patreon-tag { color: #e60054; border-color: #e60054; }
    .twitch-tag { color: #9147ff; border-color: #9147ff; }
    
    .stream-main { display: flex; flex: 1; min-height: 0; }
    .stream-panel { flex: 1; position: relative; background: #000; }
    .stream-panel iframe { width: 100%; height: 100%; border: none; display: block; }
    
    /* Contenedor alternativo si la plataforma no permite iframe */
    .fallback-container {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #141416;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 5;
    }
    .fallback-title { color: #efeff1; font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .fallback-text { color: #adadb8; font-size: 13px; max-width: 300px; margin-bottom: 20px; }
    .fallback-btn {
      background: #e60054; color: white; text-decoration: none;
      padding: 12px 24px; border-radius: 6px; font-size: 14px; font-weight: 600;
      transition: background 0.2s; display: inline-block;
    }
    .fallback-btn:hover { background: #ff1a6c; }

    .stream-divider { width: 2px; background: #2a2a2e; flex-shrink: 0; }
    .chat-panel {
      width: 360px; flex-shrink: 0;
      display: flex; flex-direction: column; background: #18181b;
    }
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid #2a2a2e;
      background: #1f1f23; flex-shrink: 0;
    }
    .chat-header-title {
      display: flex; align-items: center; gap: 7px;
      color: #efeff1; font-size: 13px; font-weight: 600;
    }
    .twitch-dot {
      width: 8px; height: 8px; background: #9147ff;
      border-radius: 50%; animation: pulse-twitch 2s infinite;
    }
    @keyframes pulse-twitch {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }
    .chat-panel iframe { flex: 1; width: 100%; border: none; display: block; }
    .stream-footer {
      background: #18181b; border-top: 1px solid #2a2a2e;
      padding: 8px 16px; display: flex;
      align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .footer-links { display: flex; gap: 12px; }
    .footer-link { color: #adadb8; font-size: 12px; text-decoration: none; transition: color 0.2s; }
    .footer-link:hover { color: #efeff1; }
    .footer-link.patreon:hover { color: #e60054; }
    .footer-link.twitch:hover { color: #9147ff; }
    .footer-info { color: #5a5a66; font-size: 11px; }
    
    @media (max-width: 768px) {
      html, body { overflow: auto; }
      .stream-page-wrapper { height: auto; min-height: 100vh; }
      .stream-main { flex-direction: column; }
      .stream-panel { height: 56.25vw; min-height: 200px; }
      .chat-panel { width: 100%; height: 50vh; }
      .stream-topbar { flex-direction: column; align-items: stretch; gap: 10px; }
      .url-changer-container { max-width: 100%; }
    }
  </style>
</head>
<body>
<div class="stream-page-wrapper">

  <div class="stream-topbar">
    <div class="stream-topbar-left">
      <span class="live-badge">● STREAM</span>
      
      <div class="url-changer-container">
        <input 
          type="text" 
          id="streamUrlInput" 
          class="url-input" 
          placeholder="Pega la URL del reproductor (Vimeo, OK.ru, etc)..."
          value=""
        >
        <button class="url-btn" onclick="updateStreamPlayer()">Cargar</button>
      </div>
    </div>
    
    <div class="stream-topbar-right">
      <span class="platform-tag patreon-tag">▶ Panel</span>
      <span class="platform-tag twitch-tag">💬 Twitch Chat</span>
    </div>
  </div>

  <div class="stream-main">

    <div class="stream-panel">
      <iframe
        id="mainStreamPlayer"
        src="about:blank"
        allowfullscreen="true"
        allow="autoplay; fullscreen; encrypted-media"
        title="Reproductor de directo"
      ></iframe>

      <div id="fallbackView" class="fallback-container">
        <div class="fallback-title">Enlace de Patreon Detectado</div>
        <div class="fallback-text">Patreon no permite mostrar su web aquí dentro. Usa el botón de abajo para ver el vídeo mientras mantienes el chat abierto.</div>
        <a href="#" id="fallbackExternalBtn" target="_blank" rel="noopener" class="fallback-btn">Ver vídeo en Patreon</a>
      </div>
    </div>

    <div class="stream-divider"></div>

    <div class="chat-panel">
      <div class="chat-header">
        <div class="chat-header-title">
          <span class="twitch-dot"></span>
          Chat de Twitch
        </div>
        <span style="color:#9147ff; font-size:11px; font-weight:600;">cineillojuan</span>
      </div>
      <iframe
        src="https://www.twitch.tv/embed/cineillojuan/chat?darkpopout&parent=jonpsybusiness.github.io"
        title="Chat de cineillojuan en Twitch"
      ></iframe>
    </div>

  </div>

  <div class="stream-footer">
    <div class="footer-links">
      <a href="#" id="footerDirectLink" target="_blank" rel="noopener" class="footer-link patreon">❤️ Enlace Externo</a>
      <a href="https://www.twitch.tv/cineillojuan" target="_blank" rel="noopener" class="footer-link twitch">💜 Ver en Twitch</a>
    </div>
    <span class="footer-info">Panel inteligente anti-bloqueos</span>
  </div>

</div>

<script>
  function updateStreamPlayer() {
    const inputVal = document.getElementById('streamUrlInput').value.trim();
    const player = document.getElementById('mainStreamPlayer');
    const fallback = document.getElementById('fallbackView');
    const fallbackBtn = document.getElementById('fallbackExternalBtn');
    const footerLink = document.getElementById('footerDirectLink');
    
    if (inputVal !== "") {
      footerLink.href = inputVal;
      
      // CONTROL ANTI-BLOQUEO DE PATREON
      if (inputVal.includes("patreon.com")) {
        // Ocultamos el iframe roto y activamos la vista limpia con botón externo
        player.style.display = "none";
        fallback.style.display = "flex";
        fallbackBtn.href = inputVal;
        
        // Abre el directo automáticamente en otra pestaña para agilizar en móviles
        window.open(inputVal, '_blank');
      } else {
        // Si es un enlace de reproducción directa (Vimeo, Youtube, OK.ru, Kick...), carga perfecto
        fallback.style.display = "none";
        player.style.display = "block";
        
        let finalUrl = inputVal;
        // Corrección rápida automática si pegas un enlace normal de OK.ru en vez de embed
        if (finalUrl.includes("ok.ru/video/") && !finalUrl.includes("videoembed")) {
          finalUrl = finalUrl.replace("ok.ru/video/", "ok.ru/videoembed/");
        }
        
        player.src = finalUrl;
      }
    }
  }

  document.getElementById('streamUrlInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      updateStreamPlayer();
    }
  });
  
  // Mostrar mensaje inicial limpio en el reproductor de vídeo
  document.getElementById('mainStreamPlayer').src = "about:blank";
</script>
</body>
</html>
