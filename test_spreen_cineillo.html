<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión Jonpsykez</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0e0e10;
            color: #efeff1;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        /* Contenedor de la Webcam */
        .video-container {
            flex: 3; /* Ocupa el 75% del ancho de la pantalla */
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta la webcam para llenar todo su espacio */
        }
        /* Contenedor del Chat de Twitch */
        .chat-container {
            flex: 1; /* Ocupa el 25% restante */
            border-left: 1px solid #2f2f35;
            background-color: #18181c;
            height: 100%;
            min-width: 300px; /* Evita que el chat se vuelva demasiado estrecho */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Lado Izquierdo: Cámara web en tiempo real -->
    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <!-- Lado Derecho: Chat oficial de jonpsykez -->
    <div class="chat-container">
        <!-- Configurado con los parámetros obligatorios de seguridad de Twitch para GitHub Pages -->
        <iframe src="https://twitch.tv" 
                id="twitch-chat">
        </iframe>
    </div>

    <script>
        // Captura el elemento de video del HTML
        const video = document.getElementById('webcam');

        // Solicita los permisos de la webcam al usuario que visita la web
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                })
                .catch(function(error) {
                    console.error("Error al acceder a la webcam: ", error);
                    alert("Para que funcione la transmisión local, por favor acepta el permiso de la cámara web.");
                });
        } else {
            alert("Este navegador no es compatible con la captura de webcam integrada.");
        }
    </script>
</body>
</html>
